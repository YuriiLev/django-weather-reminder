[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    "migrations",
    ".venv",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]
ignore = ["E501"]

[tool.coverage.run]
source = ["accounts", "weather", "subscriptions"]
omit = [
    "*/migrations/*",
    "*/apps.py",
    "*/__init__.py",
]